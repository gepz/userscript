name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The diff gate turns eslint --fix rewrites into failures — see
      # docs/architecture.md, "Verification".
      - name: Lint
        run: |
          pnpm -r run lint
          git diff --exit-code || { echo '::error::eslint --fix changed files; run pnpm -r run lint locally and commit'; exit 1; }

      # Also the bulk of the type checking (docs/architecture.md,
      # "Verification"). pnpm orders packages topologically, so libs build
      # before consumers.
      - name: Build
        run: pnpm -r run build

      # Userscripts only: bare tsc reports the dependency-declaration
      # errors fork-ts-checker misses, and lib packages already got a real
      # tsc run from build-lib in the Build step — see docs/architecture.md,
      # "Verification".
      - name: Typecheck userscripts with bare tsc
        run: |
          pnpm --filter @userscript/flow-youtube-chat run typecheck
          pnpm --filter @userscript/custom-sort run typecheck

      # Runs in every package that defines a test script (currently only
      # flow-youtube-chat's vitest suite); new suites join automatically.
      - name: Test
        run: pnpm -r run test

      # Build regenerated lib/; drift from the committed copy means
      # siblings were consuming stale code — see docs/architecture.md,
      # "Verification".
      - name: Committed lib/ output is current
        run: git diff --exit-code || { echo '::error::committed lib/ output is stale; run build-lib and commit the result'; exit 1; }
